# ============================================================================
# docker-compose.yml
#
# RPMS Production Docker Compose Stack
# Services: app (PHP-FPM), nginx, mysql, redis
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f app        # Stream app logs
#   docker compose exec app bash      # Shell into PHP-FPM container
# ============================================================================

version: '3.9'

services:

  # --------------------------------------------------------------------------
  # PHP-FPM Application
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpms_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rpms_production}
      DB_USERNAME: ${DB_USERNAME:-rpms_user}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"Gambella University RPMS"}
      RPMS_2FA_ISSUER: ${RPMS_2FA_ISSUER:-"Gambella University RPMS"}
      RPMS_ENABLE_QUEUE_WORKER: "true"
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rpms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: rpms_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/sites-available/default:ro
      - ./public:/var/www/public:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - rpms_network

  # --------------------------------------------------------------------------
  # MySQL 8.0 Database
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: rpms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-rpms_production}
      MYSQL_USER: ${DB_USERNAME:-rpms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_EXPOSE_PORT:-3307}:3306"
    networks:
      - rpms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis 7 (Cache, Session, Queues)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rpms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSE_PORT:-6380}:6379"
    networks:
      - rpms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  rpms_network:
    driver: bridge
