name: CI — Laravel Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, gd, zip, curl, bcmath, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: |
          cp .env.example .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite test database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations and demo seeders
        run: php artisan migrate --seed --force

      - name: Run test suite (parallel)
        run: php artisan test --parallel

      - name: Verify application health
        run: |
          php artisan serve --port=8787 &
          sleep 3
          curl -sf http://127.0.0.1:8787/health || echo "Health check note: may require DB"
          kill %1 2>/dev/null || true
